spring.application.name=someta
spring.main.web-application-type=servlet
server.port=80
server.servlet.context-path=/someta

# Language Settings
spring.messages.basename=i18n
spring.messages.encoding=UTF-8

# Logging Level (trace > debug > info > warn > error)
logging.level.root=info

#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.sql.init.platform=oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=firstproc
spring.datasource.password=firstproc

# HikariCP Connection Pool Size Configuration
spring.datasource.hikari.maximum-pool-size=5

#myBatis mapping
#typeAlias => @Alias("AliasName")
mybatis.type-aliases-package=kr.co.ictedu.someta.vo
#mapper => src/main/resources : classpath
mybatis.mapper-locations=classpath:mappers/*.xml

#fileupload config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB
spring.servlet.multipart.file-size-threshold=2KB
